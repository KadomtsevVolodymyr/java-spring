<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Medical Record</title>
</head>

<body>
  <h1>Create a New Medical Record</h1>

  <form th:action="@{/views/records}" th:object="${record}" method="post">
    <label for="patientName">Patient Name:</label>
    <input type="text" id="patientName" name="patientName" th:field="*{patientName}" />
    <span th:if="${#fields.hasErrors('patientName')}" th:errors="*{patientName}" style="color: red;"></span>

    <label for="diagnosis">Diagnosis:</label>
    <input type="text" id="diagnosis" name="diagnosis" th:field="*{diagnosis}" />
    <span th:if="${#fields.hasErrors('diagnosis')}" th:errors="*{diagnosis}" style="color: red;"></span>

    <button type="submit">Create Record</button>
  </form>

  <br>
  <a href="/views/records">Back to Records List</a>
</body>

</html>
