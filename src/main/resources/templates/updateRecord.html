<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update Medical Record</title>
</head>

<body>
  <h1>Update Medical Record</h1>
  <form th:action="@{/views/records/{id}/update(id=${record.id})}" th:object="${record}" method="post">

    <label for="patientName">Patient Name:</label>
    <input type="text" id="patientName" th:field="*{patientName}" />
    <span th:if="${#fields.hasErrors('patientName')}" th:errors="*{patientName}" style="color: red;"></span>

    <label for="diagnosis">Diagnosis:</label>
    <input type="text" id="diagnosis" th:field="*{diagnosis}" />
    <span th:if="${#fields.hasErrors('diagnosis')}" th:errors="*{diagnosis}" style="color: red;"></span>

    <button type="submit">Update</button>
  </form>
</body>

</html>
